services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      GA4_PROPERTY_ID: "516899630"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ga4-service-account.json
      AUTH_ENABLED: "false"
      CORS_ORIGINS: "*"
    volumes:
      - "${GA4_CREDENTIALS_HOST_PATH}:/run/secrets/ga4-service-account.json:ro"
    restart: unless-stopped

