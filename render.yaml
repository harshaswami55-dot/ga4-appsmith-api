services:
  - type: web
    name: sumlink-analytics-api
    runtime: node
    plan: free
    region: singapore
    rootDir: node-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: RATE_LIMIT_MAX
        value: "100"
