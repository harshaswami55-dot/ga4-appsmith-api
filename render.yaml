services:
  - type: web
    name: sumlink-analytics-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GA4_PROPERTY_ID
        value: "516899630"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: BIGQUERY_ENABLED
        value: "false"
      - key: BIGQUERY_PROJECT_ID
        value: ga-biquery-analytics
      - key: BIGQUERY_DATASET
        value: analytics_516899630
      - key: BIGQUERY_LOCATION
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: API_KEYS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
