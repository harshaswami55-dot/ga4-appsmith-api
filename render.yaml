services:
  - type: web
    name: sumlink-analytics-api
    runtime: node
    plan: free
    region: singapore
    rootDir: node-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: GA4_PROPERTY_ID
        value: "516899630"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: API_KEYS
        sync: false
      - key: APPSMITH_ORIGIN
        sync: false
      - key: CACHE_TTL_MS
        value: "300000"
